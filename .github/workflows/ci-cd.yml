name: PhosphOps CI/CD

# Se déclenche sur push/PR vers main et develop
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  BACKEND_IMAGE: malakmessawi/phosphops-backend
  FRONTEND_IMAGE: malakmessawi/phosphops-frontend

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 — Backend : build + tests (Spring Boot / Maven)
  # ─────────────────────────────────────────────
  backend-build:
    name: Backend - Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./PhosphOps
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: phosphopsdb
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Wait for PostgreSQL to be ready
        run: |
          for i in {1..15}; do
            pg_isready -h localhost -p 5432 -U postgres && echo "Postgres is up" && exit 0
            echo "Waiting for Postgres... ($i)"
            sleep 2
          done
          echo "Postgres never became ready" && exit 1

      - name: Build with Maven (skip tests d'abord pour compiler)
        run: mvn -B clean compile

      - name: Run tests
        env:
          SPRING_PROFILES_ACTIVE: local
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: mvn -B test

      - name: Package (jar)
        if: github.ref == 'refs/heads/main'
        run: mvn -B package -DskipTests

      - name: Upload jar artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: PhosphOps/target/*.jar
          retention-days: 5

  # ─────────────────────────────────────────────
  # JOB 2 — Frontend : build + tests (Angular)
  # ─────────────────────────────────────────────
  frontend-build:
    name: Frontend - Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./PhosphOpsFront
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: PhosphOpsFront/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Run unit tests (headless)
        run: npm run test --if-present -- --watch=false --browsers=ChromeHeadless
        continue-on-error: true

      - name: Build (production)
        run: npm run build -- --configuration=production

      - name: Prepare deploy package
        run: |
          mkdir deploy-package
          cp -r dist/phosph-ops-front/browser/* deploy-package/
          cat > deploy-package/package.json << 'EOF'
          {
            "name": "phosph-ops-front-runtime",
            "version": "1.0.0",
            "private": true,
            "scripts": {
            "start": "node node_modules/serve/build/main.js -s . -l $PORT"
            },
            "dependencies": {
              "serve": "^14.2.6"
            }
          }
          EOF
          cd deploy-package && npm install --omit=dev

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: PhosphOpsFront/deploy-package/
          retention-days: 5

  # ─────────────────────────────────────────────
  # JOB 3 — Docker : build + push images (Docker Hub)
  # Ne tourne que sur push vers main (pas sur PR)
  # ─────────────────────────────────────────────
  docker-build-push:
    name: Docker - Build & Push Images
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./PhosphOps
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./PhosphOpsFront
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # JOB 4 — Deploy Frontend to Azure App Service
  # ─────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend to Azure
    runs-on: ubuntu-latest
    needs: frontend-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./frontend-dist

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: phosphopsfrontend
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_FRONTEND }}
          package: ./frontend-dist